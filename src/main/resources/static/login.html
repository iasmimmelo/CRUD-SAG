<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <section class="formulario">

        <h1>Controle Financeiro</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <div class="campo">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>


            <div class="campo">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>


            <button type="submit">
                Entrar
            </button>

        </form>


        <br>

        <a href="cadastro.html">
            Criar conta
        </a>

    </section>

</div>


<script src="login.js"></script>

</body>
</html>
