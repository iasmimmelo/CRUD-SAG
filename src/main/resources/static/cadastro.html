<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="container">

    <section class="formulario">

        <h1>Controle Financeiro</h1>

        <h2>Criar conta</h2>


        <form id="cadastroForm">


            <div class="campo">
                <label>Nome</label>
                <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required>
            </div>



            <div class="campo">
                <label>Email</label>
                <input
                        type="email"
                        id="email"
                        placeholder="Digite seu email"
                        required>
            </div>



            <div class="campo">
                <label>Senha</label>
                <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required>
            </div>



            <button type="submit">
                Cadastrar
            </button>


        </form>


        <br>


        <a href="login.html">
            Já tenho uma conta
        </a>


    </section>

</div>


<script src="cadastro.js"></script>


</body>

</html>
