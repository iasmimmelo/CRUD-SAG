<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">

</head>

<body class="tela-login">

<div class="login-container">

    <div class="login-card">

        <h1>Controle Financeiro</h1>
        <p class="subtitulo">

            Crie sua conta gratuitamente

        </p>

        <form id="cadastroForm">

            <div class="campo">
                <label>Nome</label>
                <input

                        type="text"
                        id="nome"
                        required>

            </div>

            <div class="campo">

                <label>Email</label>
                <input

                        type="email"
                        id="email"
                        required>

            </div>

            <div class="campo">

                <label>Senha</label>
                <input

                        type="password"
                        id="senha"
                        required>

            </div>

            <button

                    type="submit"
                    class="btn-principal">
                Criar Conta

            </button>

        </form>

        <div class="links-login">

            Já possui conta?
            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>

</div>

<script src="cadastro.js"></script>

</body>

</html>
